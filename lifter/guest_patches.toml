# Guest patches: every place where the lifted code differs from the game's code ON PURPOSE.
#
# Read lifter/guest_patches.py first: it says what a patch is, when the lifter applies one
# (module, the DLL file's SHA-256 and the bytes at the rva must all match; a listed patch
# that does not match stops the lift) and how a reader of the lifted C or of a module's
# report sees one.  `lifter.lift --no-patches` (GUEST_PATCHES=off for the make targets) lifts
# without them.
#
# A row here changes what the game does.  Adding or changing one is a decision of the
# project's owner, not of whoever is fixing a fault: say in the [fix] where it was decided.
#
#   [fix.<name>]   what the patch does and why, once for all its sites
#       kind       "reuse-load", the only kind there is (lifter/guest_patches.py)
#       what, why  in our own words; no listing of game code
#       ref        where it was found, measured and decided
#       decided    who decided it and when (optional)
#   [[patch]]      one site
#       fix        the name of its [fix]
#       module     the lifter's name of the module
#       sha256     of the DLL file the row was reviewed against
#       at, bytes  rva and exact bytes of the instruction that is patched
#       reuse, reuse_bytes   reuse-load: rva and exact bytes of the earlier load whose value it takes
#
# rvas are relative to the module's base.  The bytes are those of the two instructions named,
# nothing more: enough for the lifter to refuse a row that points at something else.

[fix.queue-push-one-read]
kind = "reuse-load"
what = """
In the push routine of the game's lock-free queue: under the queue's lock the routine loads \
the link of the tail node twice, a few instructions apart.  The second load now takes the \
value of the first instead of reading memory again.  (Both read the same location: the first \
through the register that holds the tail node's address, the second through a copy of that \
address which the routine has just reloaded from its own stack slot, where it stored the \
register before taking the lock.)  With the patch the routine stores its node into the link \
exactly when it goes on to report that it did; nothing else about the routine changes."""
why = """
The routine does a compare-and-swap by hand.  The first load's value decides, after the lock \
is released, whether the push succeeded; the second decides whether the node is stored.  One \
value is meant.  But the first thing every push does, before it takes the lock, is to write \
the end mark into the link of the node it was given, and that node can be a recycled one that \
a waiting pusher still holds as its tail.  When that write lands between the two loads, the \
waiting pusher links its node and concludes that it failed, goes round and links the same \
node again.  The queue then faults or hangs at some later time.  It is the game's own race, \
not the lifter's: the game's queue self-test fails in 4 of 400 runs of the real DLL on real \
x86.  In lifted code the two loads are further apart in time and it failed in 38 of 200."""
ref = [
    "docs/handoff/gate2-threads-2.md (the race, at the tier0 site, and the experiment that removed it)",
    "docs/findings/36-queue-race-sites.md (the 11 copies of the routine in 8 DLLs)",
    "issue 29, the comments of 2026-10-10 (the measurement on real x86, and the decision)",
    "docs/handoff/lifter-patch-queue.md (this table; the counts with and without the patch)",
]
decided = "the owner, 2026-10-10, on issue 29: measure on real x86 first, patch if that answers it; it did"

# The 11 sites.  The routine is one template: at every site the first load is 0x3f bytes and
# the second 0x47 bytes into the function, with the same registers
# (tools/scout/qrace_patch_sites.py compares the sites with each other).

# tier0+0x1d5e0: reached only from tier0's own queue self-test (RunTSQueueTests): the one site that can be run today
[[patch]]
fix = "queue-push-one-read"
module = "tier0"
sha256 = "2ff3a9bf91d67b8d8e2c3c08eba4c8b38e8d39cb876d910d9f187ff1af4f2df0"
at = 0x1d627
bytes = "48 8b 08"
reuse = 0x1d61f
reuse_bytes = "48 8b 2e"

